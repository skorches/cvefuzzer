[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvefuzz"
version = "0.1.0"
description = "Local-first security inventory and testing controller"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cvefuzz = "cvefuzz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
